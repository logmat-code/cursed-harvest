<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.png">
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0a0e;
        color: #e2dac9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
      }
      #game-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 177.78vh; /* 16:9 Aspect Ratio */
        max-height: 56.25vw;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0b0a0e;
        cursor: default;
        outline: none;
      }
      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0b0a0e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: opacity 0.5s ease-out;
      }
      .loading-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #f5c442;
        margin-bottom: 8px;
        text-shadow: 0 0 15px rgba(245, 196, 66, 0.4);
      }
      .loading-subtitle {
        font-size: 13px;
        letter-spacing: 2px;
        color: #9c8e7d;
        margin-bottom: 24px;
        text-transform: uppercase;
      }
      .progress-bar-container {
        width: 260px;
        height: 8px;
        background: #1c1822;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid #3d3445;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
      }
      .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #d47a22, #f5c442);
        box-shadow: 0 0 8px rgba(245, 196, 66, 0.6);
        transition: width 0.15s ease-out;
      }
      #fullscreen-btn {
        position: absolute;
        bottom: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        background: rgba(20, 18, 25, 0.65);
        border: 1px solid rgba(245, 196, 66, 0.3);
        border-radius: 6px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 5;
        transition: background 0.2s, transform 0.1s, border-color 0.2s;
      }
      #fullscreen-btn:hover {
        background: rgba(35, 30, 45, 0.9);
        border-color: rgba(245, 196, 66, 0.7);
        transform: scale(1.05);
      }
      #fullscreen-btn svg {
        width: 18px;
        height: 18px;
        fill: #f5c442;
      }
      #unity-warning {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(180, 40, 40, 0.9);
        color: #fff;
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 13px;
        display: none;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="1"></canvas>
      
      <div id="loading-overlay">
        <div class="loading-title">CURSED HARVEST</div>
        <div class="loading-subtitle">Awakening the Blighted Earth...</div>
        <div class="progress-bar-container">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <button id="fullscreen-btn" title="Toggle Fullscreen">
        <svg viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>

      <div id="unity-warning"></div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingOverlay = document.querySelector("#loading-overlay");
      const progressFill = document.querySelector("#progress-fill");
      const fullscreenBtn = document.querySelector("#fullscreen-btn");
      const warningBanner = document.querySelector("#unity-warning");

      function showBanner(msg, type) {
        warningBanner.innerHTML = msg;
        warningBanner.style.display = "block";
        if (type === "error") {
          warningBanner.style.background = "rgba(180, 40, 40, 0.95)";
        } else {
          warningBanner.style.background = "rgba(200, 140, 20, 0.95)";
          setTimeout(() => { warningBanner.style.display = "none"; }, 5000);
        }
      }

      // Input Focus & Browser Scroll Prevention
      window.addEventListener("keydown", function(e) {
        // Prevent scrolling with Space, Arrows, PageUp/Down inside game
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown"].indexOf(e.code) > -1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Auto-focus canvas on user interaction
      function focusGame() {
        if (canvas) canvas.focus();
      }
      canvas.addEventListener("click", focusGame);
      canvas.addEventListener("mousedown", focusGame);
      window.addEventListener("click", focusGame);

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        autoSyncPersistentDataPath: true, // Auto sync PlayerPrefs & save files to IndexedDB!
        matchWebGLToCanvasSize: false
      };

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressFill.style.width = (progress * 100) + "%";
        }).then((unityInstance) => {
          loadingOverlay.style.opacity = "0";
          setTimeout(() => {
            loadingOverlay.style.display = "none";
          }, 500);

          fullscreenBtn.style.display = "flex";
          fullscreenBtn.onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          focusGame();
        }).catch((message) => {
          showBanner(message, "error");
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
